name: Deploy to Netlify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          # Deliberately NOT using cache option

      - name: Create minimal valid package-lock.json before setup
        run: |
          echo '{
            "name": "sommerhus-i-ebeltoft",
            "version": "1.1.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "sommerhus-i-ebeltoft",
                "version": "1.1.0"
              }
            }
          }' > package-lock.json
          echo "Created minimal package-lock.json:"
          cat package-lock.json

      - name: Install dependencies
        run: |
          # Force install without using package-lock
          npm install --no-package-lock
          echo "Verifying node_modules exists:"
          ls -la node_modules | head -n 5

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5